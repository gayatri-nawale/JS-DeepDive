<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>Arrays</h1>

    <script>
      let arr = [1, 2, 3, 22, 54, 45, 6];
      console.log(arr);

      arr.push(10, 11);
      console.log(arr);

      arr.unshift(9);
      console.log(arr);

      arr.pop();

      arr.shift();
      console.log(arr);

      arr.reverse();
      console.log(arr);

      arr.sort((a, b) => a - b);
      console.log(arr);

      //  arr.sort((a,b)=>b-a)
      //  console.log(arr)

      arr.splice(2, 2);
      console.log(arr);

      let newarr = arr.slice(2, 4);
      console.log(newarr);

      let a1 = [3, 5, -66, 12, 23, 34, 1, 55, 1];
      let a2 = a1.map(function (val) {
        if (val > 10) return val;
      });
      console.log(a2);
      let a3 = a1.filter(function (val) {
        if (val > 10) return true;
      });

      console.log(a3);

      let sum = a1.reduce(function (acc, val) {
        return acc + val;
      }, 0);
      console.log(sum);

      let a4 = a1.find(function (val) {
        return val < -2;
      });
      console.log(a4);

      let a5 = a1.some(function (val) {
        return val > 10;
      });
      console.log(a5);

      // every()
      let a6 = a1.every(function (val) {
        return val > 0;
      });
      console.log(a6);

      //copy arr
      let b1 = [1, 2, 4, 35, 76, 99];
      let b2 = [...b1];
      console.log(b1);
      console.log(b2);
      b2.pop();
      console.log(b2);
      console.log(b1);

      //replace mango by kiwi
      let fruits =["papaya","chiku","mango","apple","grapes"]
      fruits.splice(2,1,"kiwi")
      console.log(fruits)

      // add orange and banana at index 1
      fruits.splice(1,0,"banana","orange")
            console.log(fruits)

        
      // destrcuting array values
      let fullname=["Gayatri","Sandip","Nawale"]
      let [firstname,,lastname]=fullname
      console.log(firstname)
      console.log(lastname)
    </script>
  </body>
</html>
<!-- 

Array: An array is a collection of multiple values (of the same or different data types) stored in a single variable.

Array Methods:

1. push(value): Adds one or more elements at the end of the array.

2. pop(): Removes the last element from the array.

3. unshift(value): Adds one or more elements at the beginning of the array.

4. shift(): Removes the first element from the array.

5. reverse(): Reverses the order of elements in the original array.

6. sort(): Sorts the elements of the array in ascending or descending order based on the comparison function provided. Modifies the original array.

7. splice(startIndex, deleteCount): Adds, removes, or replaces elements in the original array from the specified index.

8. slice(startIndex, endIndex): Returns a new array containing elements from the specified start index to the end index (exclusive). Does not modify the original array.

splice()	                                slice()
Modifies the original array.        	    Does not modify the original array.
Can add, remove, or replace elements.	    Extracts elements into a new array.
Takes start index and delete count. 	    Takes start index and end index (exclusive).

Note: push(), pop(), shift(), unshift(), reverse(), sort(), and splice() modify the original array, whereas slice() does not.

foreach() , map(), reduce(), filter() -> takes function with one parameter 

1. map()
    - Returns a new array by performing an operation on each element.
    - The returned array has the same length as the original array.
    - If no value is returned, it stores undefined.
2. filter()
    - Returns a new array containing only the elements that satisfy the given condition.
    - Returns elements for which the condition is true.
3. reduce()
    - Reduces an array into a single value by performing an operation on each element.
    - Takes two main parameters: accumulator and currentValue.
    - Commonly used for calculating sum, product, etc.
4. find()
    - Returns the first element that satisfies the given condition.
    - Returns undefined if no element matches the condition.
5. some()
    - Checks whether at least one element satisfies the given condition.
    - Returns true if at least one element matches; otherwise, returns false.
6. every()
    - Checks whether all elements satisfy the given condition.
    - Returns true if all elements match; otherwise, returns false.

Copying an Array (Spread Operator)
- To create a copy of an array by value, we use the spread operator (...).
- It creates a new array with the same elements as the original array.
- Changes to the new array (such as adding or removing elements) do not affect the original array.

    The spread operator (...) creates a shallow copy of an array or object.
    In a shallow copy, primitive values are copied, but nested arrays or objects share the same reference as the original.
    Therefore, changes made to nested arrays or objects in the copied array can also affect the original array.
    To create a completely independent copy, we can use a deep copy.
