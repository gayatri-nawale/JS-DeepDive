<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Operators</h1>

    <script>
        let a="50";

        console.log(typeof a); //string

        let b=+a;
        console.log(typeof b); //number +"50"

        let c="sam";
        console.log((+c)) //nan
        console.log(typeof (+c))  //number


    </script>
</body>
</html>


<!-- 

Operators:  special symbols used to perform operations on variables and values.
1. arithmetic : + - * / % 
2. comparison : == === > < >= <= != !==
3. assignment : = += -= /= *= %= 
4. logical : && || !
5. unary : + - ! typeof  ++ --
6. ternary : ?:

// typeof :  check data type of variable 
instanceof : check if variable is part of identity (Array, Object ) only for reference values

 a instanceof Array //true
