    <h1>Conditional Statements: Execute code based on a condition</h1>
    <h3>if else, switch</h3>
    <h2>ROCK PAPER SCISSOR Game</h2>
</body>
<script>

    function rpsgame(user,computer){
        if(user === computer) return "Draw";

        if(user =="rock" && computer =="scissor") return "User Win";
        if(user =="scissor" && computer =="paper") return "User Win";
        if(user =="paper" && computer =="rock") return "User Win";

        return "Computer Win"
    }

console.log(rpsgame("rock","scissor"))
</script>
